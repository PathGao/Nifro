# Unused-code scan. Run it before adding anything to `retain_*` below.
#
#   periphery scan
#
# The scanner is a good signal and a bad judge. It reads the code and nothing
# else, so anything the runtime reaches without naming — a selector, an App
# Intent, a property whose whole job is to hold a reference — comes back as
# unused. Deleting those compiles fine and breaks at runtime, which is the worst
# way to find out.
#
# Every entry below is therefore a claim that has to be argued, not a way to
# quiet the tool. If the reason stops being true, the entry should fail.

project: Nifro.xcodeproj
schemes:
  - Nifro
targets:
  - Nifro

# Selector targets and anything else Objective-C can reach by name at runtime.
retain_objc_accessible: true

retain_public: true

report_exclude:
  # App Intents. The system finds and runs these; no Swift code names them.
  # Deleting one silently removes a Shortcuts action.
  - "**/Intents.swift"

# Named retentions, each with the reason it is not really dead.
retain_files: []

# Nothing is retained by name right now. The one entry that used to be here was
# `Zoom.init(center:scale:)`, kept because the SwiftPM test target uses it and this scan — configured
# against the Xcode project — cannot see that target. It is gone because the initializer is gone: once
# the rectangle-based one was deleted, the memberwise initializer is synthesized and writing it out
# was the thing SwiftLint objected to. The reason expired with the code, which is the point of making
# every entry argue for itself.
#
# Everything is reported by nothing, and the scan runs with `--strict`, so anything new fails CI.
#
# The three findings that used to be listed here were parameters that `#selector` signatures require
# and nothing reads. They are written `_` now, which is what they always were — the scan was right,
# and the honest fix was smaller than the paragraph explaining why it should be ignored.
#
# When something does get reported, argue it here or delete it. An entry for a finding the scan no
# longer reports is a justification that has outlived its reason, which is the thing this file exists
# to prevent.
