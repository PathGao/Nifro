name: Site submission
description: Suggest a website that works well as a wallpaper, for the site list
labels: ["site submission"]
body:
  - type: markdown
    attributes:
      value: |
        This is the easiest way to contribute to Nifro, and it is a real contribution: the site list is how people find something worth putting on their desktop. You need no Swift, no Xcode, no build and no git — the app writes the hard part for you.

        **In Nifro: open the website for editing and press “Copy Settings”, then paste it below.** That block carries the address, the rendering mode, sound, region, display and hours as you actually have them, on a page you have actually been looking at. It is worth more than the same values retyped, because it is a configuration known to work rather than one somebody remembered.

        One site per issue, please.

  - type: textarea
    id: settings
    attributes:
      label: The settings, from “Copy Settings”
      description: |
        Nifro → open the website for editing → **Copy Settings** → paste here.

        Custom CSS and JavaScript are reported by size rather than by content, so nothing private ends up in a public issue. If yours matter to how the page looks, paste them in the boxes further down.
      render: text
      placeholder: |
        Nifro 0.1.0 (1) · macOS 26.1 · MacBookAir15,2
        URL: https://example.com/live?theme=dark
        Rendering: Refresh periodically
        Sound: Muted
        Region: 2.3× at 40%, 60%
        Clickable on the desktop: no
        …
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: What does it look like, and why does it work as a wallpaper?
      description: One or two sentences. What it shows, and what makes it survive being stared at all day — no autoplay noise, no cookie banner, readable behind desktop icons, changes over time.
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot of it running as your wallpaper
      description: Drag the image straight into this box. Crop out anything private first.

  - type: dropdown
    id: account
    attributes:
      label: Does it need an account or an API key?
      description: Sites that need one are still welcome — they just get labelled so nobody is surprised.
      options:
        - "No, works for anyone"
        - "Needs a free account"
        - "Needs a paid account or an API key"
    validations:
      required: true

  - type: textarea
    id: custom-css
    attributes:
      label: Custom CSS
      description: Hiding a header, forcing a dark theme, enlarging a number. Leave empty if none — most entries need none.
      render: css

  - type: textarea
    id: custom-js
    attributes:
      label: Custom JavaScript
      description: Scroll position, dismissing a banner, clicking into a view. Leave empty if none. Please do not submit scripts that log in, carry a token, or send data anywhere — those cannot go in a shared list.
      render: javascript

  - type: textarea
    id: notes
    attributes:
      label: Anything the settings block does not cover
      description: A reload interval you had to work out, a placeholder like `[[screenWidth]]` in the URL, the reason you chose the rendering mode you chose. Skip if there is nothing to add.

  - type: markdown
    attributes:
      value: |
        A maintainer turns this into an entry in the site list. Opening a pull request against it yourself is welcome too, but it is the longer road and this form loses you nothing.
