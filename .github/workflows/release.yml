# 打 tag 触发的发布流水线。
#
# 每个架构单独出一份产物，不做通用二进制：一份 arm64、一份 x86_64。
# 通用包等于让每个用户下载一份自己永远用不到的另一半。
#
# 两条路径，靠 secrets 是否存在自动选择：
#   有 MACOS_CERTIFICATE_P12  → Developer ID 签名 + 公证 + staple（用户双击直接开）
#   没有                      → ad-hoc 签名（codesign -s -），靠 cask postflight 去隔离属性
# 详见 docs/RELEASE.md。

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag，例如 v0.1.0"
        required: true

env:
  XCODE_PROJECT: Nifro.xcodeproj
  XCODE_SCHEME: Nifro
  BUILT_APP_NAME: Nifro.app
  APP_NAME: Nifro
  BUNDLE_ID: com.pathgao.nifro

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析版本号并与 Config.xcconfig 对账
        id: version
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          xcconfig_version="$(sed -n 's/^MARKETING_VERSION *= *//p' Config.xcconfig | tr -d ' \r')"
          if [ "$version" != "$xcconfig_version" ]; then
            echo "::error::tag $tag 与 Config.xcconfig 的 MARKETING_VERSION ($xcconfig_version) 不一致"
            exit 1
          fi
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # secrets 不能直接写在 if: 里判断，先映射到 env 再产出一个 output
      - name: 判断是否具备签名与公证凭据
        id: caps
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -n "${CERT:-}" ]; then echo "sign=true" >> "$GITHUB_OUTPUT"; else echo "sign=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "${NOTARY_KEY:-}" ]; then echo "notarize=true" >> "$GITHUB_OUTPUT"; else echo "notarize=false" >> "$GITHUB_OUTPUT"; fi

      - name: 导入 Developer ID 证书到临时钥匙串
        if: steps.caps.outputs.sign == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain-db"
          # 钥匙串口令是一次性的，用不着做成 secret
          kc_pass="$(openssl rand -base64 24)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db

          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$keychain"

      - name: 逐架构构建、公证、打包
        id: package
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mkdir -p .release

          # 工程里默认写死了 CODE_SIGN_STYLE=Automatic / "Apple Development" / 上游的
          # DEVELOPMENT_TEAM，CI 上都不能用，这里全部用 Manual 覆盖掉。
          # ENABLE_HARDENED_RUNTIME 工程里已经是 YES，公证需要它。
          if [ "${{ steps.caps.outputs.sign }}" = "true" ]; then
            signing_args=(
              CODE_SIGN_STYLE=Manual
              CODE_SIGN_IDENTITY="Developer ID Application"
              DEVELOPMENT_TEAM="$TEAM_ID"
              OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime"
              PROVISIONING_PROFILE_SPECIFIER=""
            )
          else
            # ad-hoc："-" 表示本机签名，没有身份。沙盒 entitlements 照样会被写进签名。
            signing_args=(
              CODE_SIGN_STYLE=Manual
              CODE_SIGN_IDENTITY="-"
              DEVELOPMENT_TEAM=""
              PROVISIONING_PROFILE_SPECIFIER=""
            )
          fi

          if [ "${{ steps.caps.outputs.notarize }}" = "true" ]; then
            printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          fi

          xcodebuild -version

          for arch in arm64 x86_64; do
            echo "::group::构建 $arch"
            rm -rf .xcode-build/Build/Products

            # ONLY_ACTIVE_ARCH=NO 加单一 ARCHS：产出只含这一个架构的瘦二进制。
            xcodebuild clean build \
              -project "$XCODE_PROJECT" \
              -scheme "$XCODE_SCHEME" \
              -configuration Release \
              -destination "generic/platform=macOS" \
              -derivedDataPath .xcode-build \
              ARCHS="$arch" \
              ONLY_ACTIVE_ARCH=NO \
              "${signing_args[@]}" \
              | tee ".release/xcodebuild-$arch.log" | grep -E '^(\*\*|CodeSign|error:)' || true

            src=".xcode-build/Build/Products/Release/$BUILT_APP_NAME"
            test -d "$src" || { echo "::error::$arch 没找到 $src"; exit 1; }

            staged=".release/$arch/$APP_NAME.app"
            rm -rf ".release/$arch"
            mkdir -p ".release/$arch"
            cp -R "$src" "$staged"

            # 证明产物真的只含这一个架构。通用包混进来会在这里挂掉。
            actual="$(lipo -archs "$staged/Contents/MacOS/$APP_NAME" | tr -s ' ')"
            if [ "$actual" != "$arch" ]; then
              echo "::error::$arch 的产物实际包含 [$actual]"
              exit 1
            fi

            if [ "${{ steps.caps.outputs.notarize }}" = "true" ]; then
              # notarytool 只吃 zip/pkg/dmg，必须用 ditto 打包（保留符号链接和扩展属性）
              ditto -c -k --keepParent "$staged" "$RUNNER_TEMP/notarize-$arch.zip"
              xcrun notarytool submit "$RUNNER_TEMP/notarize-$arch.zip" \
                --key "$RUNNER_TEMP/notary.p8" \
                --key-id "$NOTARY_KEY_ID" \
                --issuer "$NOTARY_ISSUER_ID" \
                --wait
              xcrun stapler staple "$staged"
            else
              echo "::warning::$arch 为 ad-hoc 签名、未公证。brew 用户由 cask 的 postflight 去掉隔离属性；直接下 zip 的用户需手动放行。"
            fi

            zip=".release/$APP_NAME-$version-$arch.zip"
            ditto -c -k --keepParent "$staged" "$zip"
            sha="$(shasum -a 256 "$zip" | awk '{print $1}')"
            echo "zip_$arch=$zip" >> "$GITHUB_OUTPUT"
            echo "sha_$arch=$sha" >> "$GITHUB_OUTPUT"
            echo "$arch  sha256 $sha"
            echo "::endgroup::"
          done

          rm -f "$RUNNER_TEMP/notary.p8"

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: .release/xcodebuild-*.log
          if-no-files-found: ignore

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"

          if [ "${{ steps.caps.outputs.notarize }}" = "true" ] && [ "${{ steps.caps.outputs.sign }}" = "true" ]; then
            note="本次构建已用 Developer ID 签名并通过 Apple 公证，双击即可打开。"
          else
            note="本次构建为 ad-hoc 签名、**未经 Apple 公证**。推荐用 Homebrew 安装（cask 会自动去掉隔离属性）；直接下载 zip 的话，首次打开需要在「系统设置 → 隐私与安全性」里点「仍要打开」。"
          fi

          cat > "$RUNNER_TEMP/notes.md" <<EOF
          $note

          安装：\`brew install --cask PathGao/tap/nifro\`

          \`\`\`
          Apple silicon  Nifro-$version-arm64.zip   sha256 ${{ steps.package.outputs.sha_arm64 }}
          Intel          Nifro-$version-x86_64.zip  sha256 ${{ steps.package.outputs.sha_x86_64 }}
          \`\`\`
          EOF

          gh release create "$tag" ""${{ steps.package.outputs.zip_arm64 }}" "${{ steps.package.outputs.zip_x86_64 }}"" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --generate-notes \
            --notes-file "$RUNNER_TEMP/notes.md"

      # cask 里的 version / sha256 每次发布都要改，交给 CI 写回 main，省掉一次人工操作。
      # 如果 main 开了分支保护导致 push 失败，这步会告警但不影响 release 本身。
      - name: 回写 Casks/nifro.rb
        continue-on-error: true
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          sha_arm="${{ steps.package.outputs.sha_arm64 }}"
          sha_intel="${{ steps.package.outputs.sha_x86_64 }}"

          git fetch origin main
          git checkout -B main origin/main
          sed -i '' -E "s/^  version \".*\"$/  version \"$version\"/" Casks/nifro.rb
          sed -i '' -E "s/^    sha256 arm:   \".*\", intel: \".*\"$/    sha256 arm:   \"$sha_arm\", intel: \"$sha_intel\"/" Casks/nifro.rb

          if git diff --quiet -- Casks/nifro.rb; then
            echo "cask 没有变化，跳过"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "cask: bump to $version" -- Casks/nifro.rb
          git push origin main
