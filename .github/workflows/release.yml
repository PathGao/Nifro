# The release pipeline, triggered by a tag.
#
# Each architecture gets its own build, and there is no universal binary: one arm64, one x86_64.
# A universal package means every user downloads the half they can never run.
#
# Signing hangs off one secret, MACOS_CERTIFICATE_P12, and whichever certificate it holds picks the path:
#   Developer ID certificate → hardened runtime + notarization + staple (users just double-click)
#   self-signed certificate  → stable signing identity, no notarization, cask postflight strips the quarantine attribute
#   no secret                → ad-hoc, only so a fork without a certificate can still produce builds
#
# Gatekeeper turns away self-signed and ad-hoc builds alike; the difference is whether the signing
# identity stays put. Nifro is a sandboxed app, so a local file picked as a wallpaper is stored as a
# security-scoped bookmark, and that bookmark is tied to the signature. Ad-hoc signs differently on
# every build, so users lose the files they had authorised on every update. A self-signed
# certificate keeps the designated requirement the same across versions.
# See docs/RELEASE.md.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to release, for example v0.1.0"
        required: true

env:
  XCODE_PROJECT: Nifro.xcodeproj
  XCODE_SCHEME: Nifro
  BUILT_APP_NAME: Nifro.app
  APP_NAME: Nifro
  BUNDLE_ID: com.pathgao.nifro

jobs:
  release:
    # The same image CI builds on. It was macos-15, whose default Xcode is 16.4, and the project does
    # not compile with it — so the release pipeline could never have produced a build, while CI stayed
    # green on macos-26 the whole time. Two workflows building the same project on two toolchains is
    # not a difference worth having.
    runs-on: macos-26
    permissions:
      contents: write
      # The cask bump arrives as a pull request rather than a push, because `main` requires one.
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same floor as ci.yml. Asserted rather than selected by path: the image ships Xcode_26.6.app
      # and the like, so naming a path rots on the next image update.
      - name: Check the Xcode version
        run: |
          set -euo pipefail
          xcodebuild -version
          major="$(xcodebuild -version | sed -n '1s/Xcode \([0-9]*\).*/\1/p')"
          [ "$major" -ge 26 ] || { echo "::error::Xcode $major is too old; this project needs 26 or newer"; exit 1; }

      - name: Resolve the version and reconcile it with Config.xcconfig
        id: version
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          xcconfig_version="$(sed -n 's/^MARKETING_VERSION *= *//p' Config.xcconfig | tr -d ' \r')"
          if [ "$version" != "$xcconfig_version" ]; then
            echo "::error::tag $tag does not match MARKETING_VERSION ($xcconfig_version) in Config.xcconfig"
            exit 1
          fi
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # secrets cannot be tested inside an if:, so map them to env first and emit an output
      - name: Work out whether signing and notarization credentials exist
        id: caps
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -n "${CERT:-}" ]; then echo "sign=true" >> "$GITHUB_OUTPUT"; else echo "sign=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "${NOTARY_KEY:-}" ]; then echo "notarize=true" >> "$GITHUB_OUTPUT"; else echo "notarize=false" >> "$GITHUB_OUTPUT"; fi

      - name: Import the signing certificate into a temporary keychain
        id: identity
        if: steps.caps.outputs.sign == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain-db"
          # The keychain password is used once, so there is no point making it a secret
          kc_pass="$(openssl rand -base64 24)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          # The one failure that has actually happened here: the two secrets came from different runs
          # of Tools/setup-signing.sh, so the password did not open the certificate. `security` reports
          # that as "MAC verification failed during PKCS12 import (wrong password?)", which reads like
          # a typo and is usually a mismatched pair. `--upload` on that script sets both at once and
          # is the only way they cannot drift apart.
          if ! security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security; then
            echo "::error::could not import MACOS_CERTIFICATE_P12 with MACOS_CERTIFICATE_PASSWORD. Set both together: ./Tools/setup-signing.sh --export <path> --upload"
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db

          rm -f "$RUNNER_TEMP/cert.p12"

          # Without `-v`. A self-signed certificate is never "valid" in the sense that flag means —
          # nothing trusts the root, so it is listed as CSSMERR_TP_NOT_TRUSTED and `-v` reports zero
          # identities even though the import succeeded. codesign does not care: trust is the
          # verifier's problem, and signing needs the private key and nothing else. The local build
          # script has always signed with a certificate this same check calls invalid.
          listing="$(security find-identity -p codesigning "$keychain")"
          echo "$listing"

          # By SHA-1 rather than by name: unambiguous, and it does not have to survive being quoted
          # through an xcodebuild argument.
          identity="$(printf '%s\n' "$listing" | sed -n 's/^ *[0-9]*) \([0-9A-F]\{40\}\) "\([^"]*\)".*/\1 \2/p' | head -1)"
          test -n "$identity" || { echo "::error::no code-signing identity in the keychain"; exit 1; }
          hash="${identity%% *}"
          name="${identity#* }"

          echo "name=$hash" >> "$GITHUB_OUTPUT"
          # The certificate itself says which path to take, so no second secret has to declare it.
          case "$name" in
            "Developer ID Application"*) echo "kind=developer-id" >> "$GITHUB_OUTPUT" ;;
            *)                           echo "kind=self-signed"  >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Signing identity: $name ($hash)"

      - name: Build, notarize and package, one architecture at a time
        id: package
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mkdir -p .release

          # The project hard-codes CODE_SIGN_STYLE=Automatic / "Apple Development" / the upstream
          # DEVELOPMENT_TEAM, none of which works on CI, so Manual overrides all of it here.
          # ENABLE_HARDENED_RUNTIME is already YES in the project, and notarization needs it.
          # With no secret it falls back to ad-hoc: "-" means signed locally, with no identity.
          identity="${{ steps.identity.outputs.name }}"
          signing_args=(
            CODE_SIGN_STYLE=Manual
            CODE_SIGN_IDENTITY="${identity:--}"
            DEVELOPMENT_TEAM=""
            PROVISIONING_PROFILE_SPECIFIER=""
          )

          # The hardened runtime and the timestamp only mean anything for Developer ID: they are
          # preconditions for notarization, and self-signed and ad-hoc builds can never be notarized.
          if [ "${{ steps.identity.outputs.kind }}" = "developer-id" ]; then
            signing_args+=(
              DEVELOPMENT_TEAM="$TEAM_ID"
              OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime"
            )
          fi

          if [ "${{ steps.caps.outputs.notarize }}" = "true" ]; then
            printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          fi

          xcodebuild -version

          for arch in arm64 x86_64; do
            echo "::group::Build $arch"
            rm -rf .xcode-build/Build/Products

            # ONLY_ACTIVE_ARCH=NO with a single ARCHS: a thin binary holding only this architecture.
            xcodebuild clean build \
              -project "$XCODE_PROJECT" \
              -scheme "$XCODE_SCHEME" \
              -configuration Release \
              -destination "generic/platform=macOS" \
              -derivedDataPath .xcode-build \
              ARCHS="$arch" \
              ONLY_ACTIVE_ARCH=NO \
              "${signing_args[@]}" \
              | tee ".release/xcodebuild-$arch.log" | grep -E '(^\*\*|^CodeSign|error:)' || true

            src=".xcode-build/Build/Products/Release/$BUILT_APP_NAME"
            test -d "$src" || { echo "::error::$arch: $src not found"; exit 1; }

            staged=".release/$arch/$APP_NAME.app"
            rm -rf ".release/$arch"
            mkdir -p ".release/$arch"
            cp -R "$src" "$staged"

            # Prove the build really holds only this architecture. A universal binary fails here.
            actual="$(lipo -archs "$staged/Contents/MacOS/$APP_NAME" | tr -s ' ')"
            if [ "$actual" != "$arch" ]; then
              echo "::error::the $arch build actually contains [$actual]"
              exit 1
            fi

            if [ "${{ steps.caps.outputs.notarize }}" = "true" ] && [ "${{ steps.identity.outputs.kind }}" = "developer-id" ]; then
              # notarytool only takes zip/pkg/dmg, and ditto is what keeps symlinks and extended attributes
              ditto -c -k --keepParent "$staged" "$RUNNER_TEMP/notarize-$arch.zip"
              xcrun notarytool submit "$RUNNER_TEMP/notarize-$arch.zip" \
                --key "$RUNNER_TEMP/notary.p8" \
                --key-id "$NOTARY_KEY_ID" \
                --issuer "$NOTARY_ISSUER_ID" \
                --wait
              xcrun stapler staple "$staged"
            else
              echo "::warning::$arch is not notarized (signing identity ${identity:-ad-hoc}). For brew users the cask postflight strips the quarantine attribute; anyone downloading the disk image directly has to allow it by hand."
            fi

            # A disk image rather than a zip. A zip expands to a bare .app sitting in Downloads with
            # nothing to say it belongs in /Applications; a disk image with a symlink to Applications
            # next to the app says it without a word. The Applications symlink is the whole reason
            # this is the format every other Mac app ships in.
            #
            # Notarization above happens on the .app, and stapling the .app before the image is built
            # is what puts the ticket inside the image.
            image_root=".release/image-$arch"
            rm -rf "$image_root"
            mkdir -p "$image_root"
            cp -R "$staged" "$image_root/"
            ln -s /Applications "$image_root/Applications"

            dmg=".release/$APP_NAME-$version-$arch.dmg"
            rm -f "$dmg"
            hdiutil create \
              -volname "$APP_NAME" \
              -srcfolder "$image_root" \
              -fs HFS+ \
              -format UDZO \
              -ov \
              "$dmg"

            sha="$(shasum -a 256 "$dmg" | awk '{print $1}')"
            echo "dmg_$arch=$dmg" >> "$GITHUB_OUTPUT"
            echo "sha_$arch=$sha" >> "$GITHUB_OUTPUT"
            echo "$arch  sha256 $sha"
            echo "::endgroup::"
          done

          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Upload the build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-logs
          path: .release/xcodebuild-*.log
          if-no-files-found: ignore

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          # Set here as well as in the packaging step: each step is its own shell, and the release
          # notes below name the version. Under `set -u` an unset one aborts the step.
          version="${{ steps.version.outputs.version }}"

          if [ "${{ steps.caps.outputs.notarize }}" = "true" ] && [ "${{ steps.identity.outputs.kind }}" = "developer-id" ]; then
            note="This build is signed with a Developer ID certificate and notarized by Apple, so it opens on a double-click."
          else
            note="This build is self-signed and **not notarized by Apple**. Homebrew is the recommended route, since the cask strips the quarantine attribute for you. If you download the disk image directly, the first launch needs System Settings → Privacy & Security, then Open Anyway."
          fi

          cat > "$RUNNER_TEMP/notes.md" <<EOF
          $note

          Install:

          \`\`\`
          brew tap PathGao/tap https://github.com/PathGao/Nifro
          brew install --cask nifro
          \`\`\`

          \`\`\`
          Apple silicon  Nifro-$version-arm64.dmg   sha256 ${{ steps.package.outputs.sha_arm64 }}
          Intel          Nifro-$version-x86_64.dmg  sha256 ${{ steps.package.outputs.sha_x86_64 }}
          \`\`\`
          EOF

          gh release create "$tag" "${{ steps.package.outputs.dmg_arm64 }}" "${{ steps.package.outputs.dmg_x86_64 }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --generate-notes \
            --notes-file "$RUNNER_TEMP/notes.md"

      # The version and the two checksums change on every release, so they are written back rather
      # than typed. As a pull request, not a push: `main` requires one, and this step used to be the
      # thing that silently published a cask carrying a new version number and the old checksums —
      # which installs nothing and looks like a working release until somebody tries it. A pull
      # request makes that visible before it lands, which is worth the one click it costs.
      #
      # `continue-on-error` because a failure here must not take the release with it. The release is
      # already published by this point; the cask can be fixed afterwards.
      - name: Open a pull request with the new cask version
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"
          sha_arm="${{ steps.package.outputs.sha_arm64 }}"
          sha_intel="${{ steps.package.outputs.sha_x86_64 }}"

          git fetch origin main
          git checkout -B main origin/main
          sed -i '' -E "s/^  version \".*\"$/  version \"$version\"/" Casks/nifro.rb
          sed -i '' -E "s/^  sha256 arm: \".*\", intel: \".*\"$/  sha256 arm: \"$sha_arm\", intel: \"$sha_intel\"/" Casks/nifro.rb

          # Both lines have to have changed. A sed that matches nothing exits 0, so without this the
          # step would commit a cask carrying the new version number and the old checksums — which
          # installs nothing and looks like a working release until somebody tries it.
          grep -q "  version \"$version\"" Casks/nifro.rb || { echo "::error::the version writeback matched nothing"; exit 1; }
          grep -q "sha256 arm: \"$sha_arm\"" Casks/nifro.rb || { echo "::error::the sha256 writeback matched nothing"; exit 1; }

          if git diff --quiet -- Casks/nifro.rb; then
            echo "cask unchanged, skipping"
            exit 0
          fi

          branch="cask/$version"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "cask: bump to $version" -- Casks/nifro.rb
          git push origin "$branch"

          body="$(printf '%s\n\n%s\n\n```\narm64   %s\nx86_64  %s\n```\n' \
            "Written by the release workflow for [$tag]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag)." \
            "Check the two checksums against the release assets before merging — a cask with the wrong ones installs nothing and looks like it worked." \
            "$sha_arm" "$sha_intel")"

          # Opening the pull request needs "Allow GitHub Actions to create and approve pull requests"
          # in the repository's Actions settings, which is off by default and is a setting a fork
          # cannot be assumed to have. The branch is already pushed either way, so when the API says
          # no, say where to click instead of leaving a branch nobody knows about.
          if ! gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title "cask: bump to $version" \
            --body "$body"
          then
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
            echo "::warning::could not open the pull request automatically. The branch is pushed; open it here: $url"
            {
              echo "### Cask bump needs a pull request"
              echo
              echo "\`$branch\` is pushed. Open it: $url"
              echo
              echo "To have this opened automatically, turn on Settings → Actions → General → Workflow permissions → **Allow GitHub Actions to create and approve pull requests**."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
