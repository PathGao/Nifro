# The release pipeline, dispatched by hand from a branch. It creates the tag itself, at the end.
#
# Each architecture gets its own build, and there is no universal binary: one arm64, one x86_64.
# A universal package means every user downloads the half they can never run.
#
# Official releases require Developer ID signing and notarization. See docs/RELEASE.md.

name: release

# Dispatched from a branch, never triggered by a tag.
#
# A tag used to be the trigger, which made pushing one both the request to release and the promise
# that the release happened -- and the `version tags` ruleset forbids moving or deleting `v*`, so the
# promise was unbreakable while the thing it promised had not run yet. v0.1.1 spent that promise on a
# run that died at the last step: the tag was frozen at a tree whose pipeline could not parse, and the
# release had to be finished from a branch instead, so the tag no longer describes how it was made.
#
# The order is reversed here. Build, sign, package, and only then create the tag, as part of creating
# the Release it belongs to. A run that fails leaves no tag, so nothing is spent and the same version
# number can be tried again once the cause is fixed. Immutability stops being a constraint to work
# around and becomes free: every `v*` tag names a tree that shipped.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, sign and package, but create no tag and no Release"
        type: boolean
        default: false

env:
  BUILT_APP_NAME: Nifro.app
  APP_NAME: Nifro
  BUNDLE_ID: com.pathgao.nifro

jobs:
  release:
    # The same image CI builds on. It was macos-15, whose default Xcode is 16.4, and the project does
    # not compile with it — so the release pipeline could never have produced a build, while CI stayed
    # green on macos-26 the whole time. Two workflows building the same project on two toolchains is
    # not a difference worth having.
    runs-on: macos-26
    environment: release-signing
    permissions:
      contents: write
      # The cask bump arrives as a pull request rather than a push, because `main` requires one.
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same floor as ci.yml. Asserted rather than selected by path: the image ships Xcode_26.6.app
      # and the like, so naming a path rots on the next image update.
      - name: Check the Xcode version
        run: |
          set -euo pipefail
          xcodebuild -version
          major="$(xcodebuild -version | sed -n '1s/Xcode \([0-9]*\).*/\1/p')"
          [ "$major" -ge 26 ] || { echo "::error::Xcode $major is too old; this project needs 26 or newer"; exit 1; }

      # `Tools/Config/App.xcconfig` is the only place a version is written. The tag is derived from it rather
      # than typed alongside it, so the two cannot disagree -- which they used to be able to, and the
      # workflow's answer was to fail after being dispatched.
      - name: Work out the version, and refuse to reuse one
        id: version
        run: |
          set -euo pipefail

          version="$(sed -n 's/^MARKETING_VERSION *= *//p' Tools/Config/App.xcconfig | tr -d ' \r')"
          tag="v$version"

          case "$version" in
            "" | *[!0-9.]* )
              echo "::error::MARKETING_VERSION is '$version', which is not a version"
              exit 1
              ;;
          esac

          # A `v*` tag cannot be moved or deleted, so a second release of one is not something to
          # recover from afterwards. Refused here, before anything is built.
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists. Bump MARKETING_VERSION in Tools/Config/App.xcconfig first."
            exit 1
          fi

          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $GITHUB_REF_NAME @ ${GITHUB_SHA:0:7}"

      - name: Require official signing and notarization credentials
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in CERT_P12 CERT_PASSWORD SIGNING_IDENTITY TEAM_ID; do
            test -n "${!name}" || { echo "::error::Missing release-signing credential: $name"; exit 1; }
          done
          if [[ -n "$NOTARY_KEY_P8" ]]; then
            test -n "$NOTARY_KEY_ID" && test -n "$NOTARY_ISSUER_ID" || { echo "::error::Incomplete notarization API key credentials"; exit 1; }
          else
            test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" || { echo "::error::Provide notarization API credentials or APPLE_ID and APPLE_APP_SPECIFIC_PASSWORD"; exit 1; }
          fi
          [[ "$SIGNING_IDENTITY" =~ ^[0-9A-F]{40}$ ]] || { echo "::error::APPLE_SIGNING_IDENTITY must be a certificate SHA-1"; exit 1; }
          [[ "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::Invalid APPLE_TEAM_ID"; exit 1; }

      - name: Import the signing certificate into a temporary keychain
        id: identity
        env:
          SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain-db"
          # The keychain password is used once, so there is no point making it a secret
          kc_pass="$(openssl rand -base64 24)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          if ! security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security; then
            echo "::error::could not import MACOS_CERTIFICATE_P12 with MACOS_CERTIFICATE_PASSWORD. Replace both environment secrets with the matching Developer ID export and password"
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db

          rm -f "$RUNNER_TEMP/cert.p12"

          listing="$(security find-identity -v -p codesigning "$keychain")"
          if ! printf '%s\n' "$listing" | grep -E "^[[:space:]]*[0-9]+\) $SIGNING_IDENTITY \"Developer ID Application: .* \($TEAM_ID\)\"$"; then
            echo "::error::The expected Developer ID certificate and private key are not valid in the release keychain"
            exit 1
          fi
          echo "name=$SIGNING_IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build, notarize and package, one architecture at a time
        id: package
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mkdir -p .release

          identity="${{ steps.identity.outputs.name }}"
          signing_args=(
            CODE_SIGN_STYLE=Manual
            CODE_SIGN_IDENTITY="$identity"
            DEVELOPMENT_TEAM="$TEAM_ID"
            PROVISIONING_PROFILE_SPECIFIER=""
            ENABLE_HARDENED_RUNTIME=YES
            OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime --keychain $RUNNER_TEMP/build.keychain-db"
          )
          if [[ -n "$NOTARY_KEY_P8" ]]; then
            printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            chmod 600 "$RUNNER_TEMP/notary.p8"
            notary_args=(--key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID")
          else
            notary_args=(--apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$TEAM_ID")
          fi

          xcodebuild -version

          for arch in arm64 x86_64; do
            echo "::group::Build $arch"
            rm -rf .xcode-build/Build/Products

            # ONLY_ACTIVE_ARCH=NO with a single ARCHS: a thin binary holding only this architecture.
            APPLE_SIGNING_IDENTITY="$identity" APPLE_TEAM_ID="$TEAM_ID" ./build.sh release \
              ARCHS="$arch" \
              ONLY_ACTIVE_ARCH=NO \
              "${signing_args[@]}" \
              | tee ".release/xcodebuild-$arch.log" | awk '/^\*\*|^CodeSign|error:/'

            src=".xcode-build/Build/Products/Release/$BUILT_APP_NAME"
            test -d "$src" || { echo "::error::$arch: $src not found"; exit 1; }

            staged=".release/$arch/$APP_NAME.app"
            rm -rf ".release/$arch"
            mkdir -p ".release/$arch"
            cp -R "$src" "$staged"

            # Prove the build really holds only this architecture. A universal binary fails here.
            actual="$(lipo -archs "$staged/Contents/MacOS/$APP_NAME" | tr -s ' ')"
            if [ "$actual" != "$arch" ]; then
              echo "::error::the $arch build actually contains [$actual]"
              exit 1
            fi

            codesign --verify --deep --strict --verbose=2 "$staged"
            codesign -d --extract-certificates="$RUNNER_TEMP/signed-" "$staged"
            actual_identity="$(shasum -a 1 "$RUNNER_TEMP/signed-0" | awk '{print toupper($1)}')"
            test "$actual_identity" = "$identity" || { echo "::error::Unexpected signing certificate"; exit 1; }
            ditto -c -k --keepParent "$staged" "$RUNNER_TEMP/notarize-$arch.zip"
            xcrun notarytool submit "$RUNNER_TEMP/notarize-$arch.zip" \
              "${notary_args[@]}" --wait
            xcrun stapler staple "$staged"
            xcrun stapler validate "$staged"
            spctl --assess --type execute --verbose=2 "$staged"

            # A disk image rather than a zip. A zip expands to a bare .app sitting in Downloads with
            # nothing to say it belongs in /Applications; a disk image with a symlink to Applications
            # next to the app says it without a word. The Applications symlink is the whole reason
            # this is the format every other Mac app ships in.
            #
            # Notarization above happens on the .app, and stapling the .app before the image is built
            # is what puts the ticket inside the image.
            image_root=".release/image-$arch"
            rm -rf "$image_root"
            mkdir -p "$image_root"
            cp -R "$staged" "$image_root/"
            ln -s /Applications "$image_root/Applications"

            # No version in the file name. It is already in the tag the asset hangs under, and
            # leaving it out is what makes /releases/latest/download/Nifro-arm64.dmg a link that
            # keeps working — the README can point straight at a build instead of at a page.
            dmg=".release/$APP_NAME-$arch.dmg"
            rm -f "$dmg"
            hdiutil create \
              -volname "$APP_NAME" \
              -srcfolder "$image_root" \
              -fs HFS+ \
              -format UDZO \
              -ov \
              "$dmg"

            sha="$(shasum -a 256 "$dmg" | awk '{print $1}')"
            echo "dmg_$arch=$dmg" >> "$GITHUB_OUTPUT"
            echo "sha_$arch=$sha" >> "$GITHUB_OUTPUT"
            echo "$arch  sha256 $sha"
            echo "::endgroup::"
          done

          rm -f "$RUNNER_TEMP/notary.p8"

      # `include-hidden-files` because everything this workflow produces lives under `.release`, and a
      # leading dot makes it hidden — which this action skips by default, with a warning nobody reads
      # on a step that reports success. No run had ever produced an artifact. The one that mattered
      # was the release that failed: RELEASE.md sends you to the xcodebuild log first, and there has
      # never been one to open.
      - name: Upload the build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-logs
          path: .release/xcodebuild-*.log
          include-hidden-files: true
          if-no-files-found: ignore

      # The dry run stops here with the disk images kept as artifacts, so the whole pipeline can be
      # exercised on a branch without spending a version number. Everything above this line has run.
      - name: Keep the disk images, on a dry run
        if: inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: dry-run-disk-images
          path: .release/*.dmg
          include-hidden-files: true
          # The disk images are the point of a dry run. Nothing to keep means the run proved less than
          # it looks like it did, so this fails rather than warns.
          if-no-files-found: error

      - name: Say what the dry run would have done
        if: inputs.dry_run
        run: |
          echo "::notice::Dry run. Would have created ${{ steps.version.outputs.tag }} at ${GITHUB_SHA:0:7} and released the two disk images above."

      # Creating the Release is what creates the tag: `--target` names the commit, and GitHub makes
      # the ref as part of the same call. So the tag exists only once everything before it has passed.
      - name: Create the tag and the GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          # Set here as well as in the packaging step: each step is its own shell, and the release
          # notes below name the version. Under `set -u` an unset one aborts the step.
          version="${{ steps.version.outputs.version }}"

          note="This build is signed with a Developer ID certificate and notarized by Apple. Users upgrading from a self-signed release may need to select their local wallpaper files again."

          cat > "$RUNNER_TEMP/notes.md" <<EOF
          $note

          Install:

          \`\`\`
          brew tap PathGao/tap https://github.com/PathGao/Nifro
          brew trust --cask PathGao/tap/nifro
          brew install --cask nifro
          \`\`\`

          Review the third-party cask before trusting it: https://github.com/PathGao/Nifro/blob/main/Casks/nifro.rb

          \`\`\`
          Apple silicon  Nifro-arm64.dmg   sha256 ${{ steps.package.outputs.sha_arm64 }}
          Intel          Nifro-x86_64.dmg  sha256 ${{ steps.package.outputs.sha_x86_64 }}
          \`\`\`
          EOF

          gh release create "$tag" "${{ steps.package.outputs.dmg_arm64 }}" "${{ steps.package.outputs.dmg_x86_64 }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes \
            --notes-file "$RUNNER_TEMP/notes.md"

      # The version and the two checksums change on every release, so they are written back rather
      # than typed. As a pull request, not a push: `main` requires one, and this step used to be the
      # thing that silently published a cask carrying a new version number and the old checksums —
      # which installs nothing and looks like a working release until somebody tries it. A pull
      # request makes that visible before it lands, which is worth the one click it costs.
      #
      # `continue-on-error` because a failure here must not take the release with it. The release is
      # already published by this point; the cask can be fixed afterwards.
      - name: Open a pull request with the new cask version
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"
          sha_arm="${{ steps.package.outputs.sha_arm64 }}"
          sha_intel="${{ steps.package.outputs.sha_x86_64 }}"

          git fetch origin main
          git checkout -B main origin/main
          sed -i '' -E "s/^  version \".*\"$/  version \"$version\"/" Casks/nifro.rb
          sed -i '' -E "s/^  sha256 arm: \".*\", intel: \".*\"$/  sha256 arm: \"$sha_arm\", intel: \"$sha_intel\"/" Casks/nifro.rb

          # Both lines have to have changed. A sed that matches nothing exits 0, so without this the
          # step would commit a cask carrying the new version number and the old checksums — which
          # installs nothing and looks like a working release until somebody tries it.
          grep -q "  version \"$version\"" Casks/nifro.rb || { echo "::error::the version writeback matched nothing"; exit 1; }
          grep -q "sha256 arm: \"$sha_arm\"" Casks/nifro.rb || { echo "::error::the sha256 writeback matched nothing"; exit 1; }

          if git diff --quiet -- Casks/nifro.rb; then
            echo "cask unchanged, skipping"
            exit 0
          fi

          branch="cask/$version"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "cask: bump to $version" -- Casks/nifro.rb
          git push origin "$branch"

          body="$(printf '%s\n\n%s\n\n```\narm64   %s\nx86_64  %s\n```\n' \
            "Written by the release workflow for [$tag]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag)." \
            "Check the two checksums against the release assets before merging — a cask with the wrong ones installs nothing and looks like it worked." \
            "$sha_arm" "$sha_intel")"

          # Opening the pull request needs "Allow GitHub Actions to create and approve pull requests"
          # in the repository's Actions settings, which is off by default and is a setting a fork
          # cannot be assumed to have. The branch is already pushed either way, so when the API says
          # no, say where to click instead of leaving a branch nobody knows about.
          if ! gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title "cask: bump to $version" \
            --body "$body"
          then
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
            echo "::warning::could not open the pull request automatically. The branch is pushed; open it here: $url"
            {
              echo "### Cask bump needs a pull request"
              echo
              echo "\`$branch\` is pushed. Open it: $url"
              echo
              echo "To have this opened automatically, turn on Settings → Actions → General → Workflow permissions → **Allow GitHub Actions to create and approve pull requests**."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP"/signed-* "$RUNNER_TEMP"/notarize-*.zip
