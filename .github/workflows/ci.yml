name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: .xcode-build/SourcePackages
          key: spm-${{ hashFiles('Nifro.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      # Signing needs a certificate we deliberately do not put in CI. Release signing lives in release.yml.
      - name: Build
        run: |
          xcodebuild build \
            -project Nifro.xcodeproj \
            -scheme Nifro \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .xcode-build \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
        env:
          NSUnbufferedIO: YES

  test:
    name: Geometry tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app

      # The crop and coverage maths are pure functions, so they run without an app bundle or a window server.
      - name: Test
        run: swift test

  lint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      # The Xcode build runs SwiftLint too, but only after compiling. Running it separately puts style feedback on a PR in under a minute.
      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging

  unused:
    name: Unused code
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app

      - name: Install Periphery
        run: brew install peripheryapp/periphery/periphery

      # Config, retentions and the reasoning behind each one live in .periphery.yml.
      # This inherited a 5,700-line utilities file copied wholesale from another
      # project; without a gate it grows back.
      - name: Scan
        run: periphery scan --strict

  sites:
    name: Site registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator
        run: pip install --quiet jsonschema pyyaml

      # A site entry is the lowest-barrier contribution we accept, so its gate has to be fast and say exactly what is wrong.
      - name: Validate every entry against the schema
        run: python3 scripts/validate-sites.py

      # The app reads sites/index.json directly from this branch, and falls back to a
      # snapshot compiled into the binary. Both are generated, so a YAML change that
      # forgets to regenerate them would silently never reach anyone.
      - name: Check the generated catalogue is current
        run: |
          python3 scripts/generate-site-catalog.py
          if ! git diff --quiet -- sites/index.json Nifro/SiteCatalog.generated.swift; then
            echo "::error::sites/ changed without regenerating. Run scripts/generate-site-catalog.py and commit the result."
            git diff --stat -- sites/index.json Nifro/SiteCatalog.generated.swift
            exit 1
          fi
