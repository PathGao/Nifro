name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # No `xcode-select`. Pinning a path meant naming `/Applications/Xcode_26.app`, which the runner
      # image does not have — it ships `Xcode_26.6.app`, `Xcode_26.5.app` and so on, so every job that
      # selected it died on step two and CI never compiled anything. The default on `macos-26` is
      # already the newest Xcode 26; assert the floor instead of naming a path that rots.
      - name: Check the Xcode version
        run: |
          set -euo pipefail
          xcodebuild -version
          major="$(xcodebuild -version | sed -n '1s/Xcode \([0-9]*\).*/\1/p')"
          [ "$major" -ge 26 ] || { echo "::error::Xcode $major is too old; this project needs 26 or newer"; exit 1; }

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: .xcode-build/SourcePackages
          key: spm-${{ hashFiles('Nifro.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      # Signing needs a certificate we deliberately do not put in CI. Release signing lives in release.yml.
      - name: Build
        run: |
          xcodebuild build \
            -project Nifro.xcodeproj \
            -scheme Nifro \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .xcode-build \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
        env:
          NSUnbufferedIO: YES

  test:
    name: Geometry tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # No `xcode-select`. Pinning a path meant naming `/Applications/Xcode_26.app`, which the runner
      # image does not have — it ships `Xcode_26.6.app`, `Xcode_26.5.app` and so on, so every job that
      # selected it died on step two and CI never compiled anything. The default on `macos-26` is
      # already the newest Xcode 26; assert the floor instead of naming a path that rots.
      - name: Check the Xcode version
        run: |
          set -euo pipefail
          xcodebuild -version
          major="$(xcodebuild -version | sed -n '1s/Xcode \([0-9]*\).*/\1/p')"
          [ "$major" -ge 26 ] || { echo "::error::Xcode $major is too old; this project needs 26 or newer"; exit 1; }

      # The crop and coverage maths are pure functions, so they run without an app bundle or a window server.
      - name: Test
        run: swift test

  lint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Pinned. `brew install swiftlint` takes whatever is current, and a minor bump changes the
      # rule set — which turns this job red on a pull request that changed nothing, and points the
      # contributor at their own diff. Bump it here, on purpose, and fix the fallout in one commit.
      - name: Install SwiftLint
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/swiftlint.zip https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip
          unzip -q -o /tmp/swiftlint.zip -d /tmp/swiftlint
          echo "/tmp/swiftlint" >> "$GITHUB_PATH"
        env:
          SWIFTLINT_VERSION: "0.65.1"

      # The Xcode build runs SwiftLint too, but only after compiling. Running it separately puts style feedback on a PR in under a minute.
      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging

  unused:
    name: Unused code
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # No `xcode-select`. Pinning a path meant naming `/Applications/Xcode_26.app`, which the runner
      # image does not have — it ships `Xcode_26.6.app`, `Xcode_26.5.app` and so on, so every job that
      # selected it died on step two and CI never compiled anything. The default on `macos-26` is
      # already the newest Xcode 26; assert the floor instead of naming a path that rots.
      - name: Check the Xcode version
        run: |
          set -euo pipefail
          xcodebuild -version
          major="$(xcodebuild -version | sed -n '1s/Xcode \([0-9]*\).*/\1/p')"
          [ "$major" -ge 26 ] || { echo "::error::Xcode $major is too old; this project needs 26 or newer"; exit 1; }

      # Pinned, for the same reason as SwiftLint: a new version finds new things, and it should find
      # them when somebody bumped it rather than on an unrelated pull request.
      - name: Install Periphery
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/periphery.zip https://github.com/peripheryapp/periphery/releases/download/${PERIPHERY_VERSION}/periphery-${PERIPHERY_VERSION}.zip
          unzip -q -o /tmp/periphery.zip -d /tmp/periphery
          echo "/tmp/periphery" >> "$GITHUB_PATH"
        env:
          PERIPHERY_VERSION: "2.21.2"

      # Config, retentions and the reasoning behind each one live in .periphery.yml.
      # This inherited a 5,700-line utilities file copied wholesale from another
      # project; without a gate it grows back.
      - name: Scan
        run: periphery scan --strict

  sites:
    name: Site registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator
        run: pip install --quiet jsonschema pyyaml

      # A site entry is the lowest-barrier contribution we accept, so its gate has to be fast and say exactly what is wrong.
      - name: Validate every entry against the schema
        run: python3 Tools/validate-sites.py

      # The app reads sites/index.json directly from this branch, and falls back to a
      # snapshot compiled into the binary. Both are generated, so a YAML change that
      # forgets to regenerate them would silently never reach anyone.
      # Cross-target identifiers no compiler compares. See the script for why.
      - name: Check the URL scheme matches in both targets
        run: python3 Tools/check-url-scheme.py

      # The README promises the app is in English and Simplified Chinese. Nothing else stops a pull
      # request adding a string in one language only, and a half-translated menu is the kind of thing
      # nobody notices until somebody who reads the other language opens it.
      - name: Check every string is translated
        run: |
          python3 - <<'CHECK'
          import json, pathlib, sys

          catalogue = json.loads(pathlib.Path("Nifro/Localizable.xcstrings").read_text())
          missing = [
              key
              for key, entry in catalogue["strings"].items()
              # The empty string and a bare format placeholder have nothing to translate.
              if key and key != "%@"
              and not entry.get("localizations", {}).get("zh-Hans", {}).get("stringUnit", {}).get("value")
          ]

          if missing:
              print(f"::error::{len(missing)} strings have no zh-Hans translation")
              for key in missing[:20]:
                  print(f"  {key[:100]}")
              sys.exit(1)

          print(f"{len(catalogue['strings'])} strings, all translated")
          CHECK

      - name: Check the generated catalogue is current
        run: |
          python3 Tools/generate-site-catalog.py
          if ! git diff --quiet -- sites/index.json Nifro/Sites/SiteCatalog.generated.swift; then
            echo "::error::sites/ changed without regenerating. Run Tools/generate-site-catalog.py and commit the result."
            git diff --stat -- sites/index.json Nifro/Sites/SiteCatalog.generated.swift
            exit 1
          fi
