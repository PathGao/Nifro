name: Minimal Clock
url: https://time.pablopunk.com/?fg=white&bg=transparent&font=SFMono-Regular,Consolas,%27Liberation%20Mono%27,Menlo,monospace
description: A plain monospace clock on a transparent background, so the wallpaper underneath shows through.
tags: [clock]
backend: snapshot
backendNote: >-
  Minute resolution only. The site also takes a `seconds` flag; it is left off here because a
  ticking seconds hand forces a live renderer for one glyph of information.
source: >-
  The maintainer's own shortlist. The colour and font are set through the query string, and
  `seconds` is left off deliberately (see backendNote).
