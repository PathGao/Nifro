redundant_discardable_let:
  ignore_swiftui_view_bodies: true
for_where:
  allow_for_as_filter: true
number_separator:
  minimum_length: 5
identifier_name:
  max_length:
    warning: 100
    error: 100
  min_length:
    warning: 2
    error: 2
  allowed_symbols:
    - '_'
  excluded:
    - 'x'
    - 'y'
    - 'z'
    - 'a'
    - 'b'
    - 'x1'
    - 'x2'
    - 'y1'
    - 'y2'
    - 'z2'
redundant_type_annotation:
  consider_default_literal_types_redundant: true
unneeded_override:
  affect_initializers: true
deployment_target:
  macOS_deployment_target: '14'
custom_rules:
  no_nsrect:
    regex: '\bNSRect\b'
    match_kinds: typeidentifier
    message: 'Use CGRect instead of NSRect'
  no_nssize:
    regex: '\bNSSize\b'
    match_kinds: typeidentifier
    message: 'Use CGSize instead of NSSize'
  no_nspoint:
    regex: '\bNSPoint\b'
    match_kinds: typeidentifier
    message: 'Use CGPoint instead of NSPoint'
  no_cgfloat:
    regex: '\bCGFloat\b'
    match_kinds: typeidentifier
    message: 'Use Double instead of CGFloat'
  no_cgfloat2:
    regex: '\bCGFloat\('
    message: 'Use Double instead of CGFloat'
  swiftui_state_private:
    regex: '@(ObservedObject|EnvironmentObject)\s+var'
    message: 'SwiftUI @ObservedObject and @EnvironmentObject properties should be private'
  swiftui_environment_private:
    regex: '@Environment\(\\\.\w+\)\s+var'
    message: 'SwiftUI @Environment properties should be private'
  swiftui_scaledtofit:
    regex: 'aspectRatio\(contentMode: \.fit\)'
    message: 'Prefer `scaledToFit()`'
  swiftui_scaledtofill:
      regex: 'aspectRatio\(contentMode: \.fill\)'
      message: 'Prefer `scaledToFill()`'
  final_class:
    regex: '^class [a-zA-Z\d]+[^{]+\{'
    message: 'Classes should be marked as final whenever possible. If you actually need it to be subclassable, just add `// swiftlint:disable:next final_class`.'
  no_alignment_center:
    regex: '\b\(alignment: .center\b'
    message: 'This alignment is the default.'

  # What a deleted member leaves behind. Nothing else reports it: `periphery` needs a declaration to
  # call unused and an extension with an empty body has none, so nine of these had accumulated in
  # `Extensions.swift`, `AppInfo.swift` and `MenuSupport.swift`, three still wearing the `// MARK:`
  # header of the type whose last member was removed — which is the jump bar the file header says the
  # MARKs are there for.
  #
  # Only the multi-line form. A conformance-only `extension NSImage: @retroactive @unchecked Sendable {}`
  # declares the conformance and is content; it is written on one line and is not matched.
  empty_extension:
    regex: 'extension [^{\n]*\{\n[ \t]*\}'
    message: 'An extension with nothing in it. Delete it, and any `// MARK:` header that only pointed at it.'

  # The three below guard the app's own drawn chrome. Each matches a SwiftUI or AppKit parameter
  # label — nothing this repo named — so renaming `PanelMetrics`, `PanelButton` or anything else here
  # cannot turn one red. `included:` is the three folders that draw; `Wallpaper`, `Support` and `App`
  # are left out because none of them paints chrome.
  #
  # `Nifro/Zoom/CropSelectionView.swift` is exempt as a whole surface rather than line by line. It
  # draws over an arbitrary web page: its black scrim, white outline and 22-point readout are
  # contrast decisions against unknown content, which is the one place in the app where a colour that
  # follows the theme is the wrong answer. Nine identical per-line reasons would say less than this
  # one. The cost is that a genuinely shared value hardcoded in that file goes unnoticed.
  #
  # Everything else takes `// swiftlint:disable:next <rule>` with its reason above it.
  # `superfluous_disable_command`, enabled above, turns each of those red once the line under it
  # stops violating, so the allowlist expires on its own.
  hardcoded_corner_radius:
    included: 'Nifro/(Screens|Zoom|Visibility)/.*\.swift'
    excluded: 'Nifro/Zoom/CropSelectionView\.swift'
    regex: '(cornerRadius|xRadius|yRadius): *[0-9]'
    message: 'Corner radii belong in PanelMetrics. Name it there, or disable this line with the reason it is not shared.'

  hardcoded_font_size:
    included: 'Nifro/(Screens|Zoom|Visibility)/.*\.swift'
    excluded: 'Nifro/Zoom/CropSelectionView\.swift'
    # `[1-9]`, not `[0-9]`: `NSFont.controlContentFont(ofSize: 0)` is AppKit's idiom for "the system
    # default size", which is the opposite of a hardcoded size.
    regex: '\.(system|systemFont|monospacedSystemFont|monospacedDigitSystemFont)\((of)?[Ss]ize: *[1-9]'
    message: 'Point sizes belong in PanelMetrics.'

  hardcoded_ui_colour:
    included: 'Nifro/(Screens|Zoom|Visibility)/.*\.swift'
    excluded: 'Nifro/Zoom/CropSelectionView\.swift'
    regex: 'Color\(red:|(NS)?Color\.(white|black)\b|AnyShapeStyle\(\.white\)'
    message: 'A literal colour follows neither the theme nor the user accent. Use PanelMetrics, or a semantic style.'
